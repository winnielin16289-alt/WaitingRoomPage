<!DOCTYPE html>
<html lang="en">
<head>
    <title>MNA waiting room page</title>
    <style>

        /* 1. 基本設定 */
        body {
            /* 移除預設邊距 */
            margin: 0;
            /* 設定字體 */
            font-family: Garamond, "微軟正黑體", "Microsoft JhengHei", sans-serif;
        }

        /* 2. 小標語區域 */
        article {
            /* 設定邊距 */
            margin: 20px;
            /* 設定內距 */
            padding: 20px;
            /* 設定圓角 */
            border-radius: 10px;
        }
        
        section {
            /* 設定背景色 */
            background-color: #bcb8b8;
            text-align: center;
            margin: 20px auto; 
            width: fit-content;
            padding: 10px 20px;   
            border-radius: 5px;
        }

        /* 3. 鋼琴圖片 */
        #piano {
          display: block;
          margin: 0 auto;
        }
    </style>
</head>

<body>
<h1 style="text-align: center; margin-top: 1em;">MNA  牛耳藝術 購票網站虛擬等候室 </h1>

<article>
    <h2 style="text-align: center; margin-top: 1em;">您的順位:340</h2>
    <h3 style="text-align: center; margin-top: 1em;">預計等候時間:30分鐘</h3>
    <section>
    由於目前線上購票人數眾多，已將您依序安排於等待區，請勿離開或重整頁面，以免喪失優先等待權益。<br>
    等待結束後將進入購票系統，進入系統後若超過10分鐘無操作，系統將會自動登出。
    </section>
</article>
<img id="piano" src="./music_piano.png" alt="Piano Image">
</body>
</html>
